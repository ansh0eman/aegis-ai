name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: SSE tests
        run: npm run test:sse
      - name: Transaction and security tests
        run: npm run test:step11
      - name: Demo tests
        run: npm run test:demo
      - name: Production build
        run: npm run build -- --webpack
