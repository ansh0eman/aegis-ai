services:
  aegis:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      AEGIS_DATABASE_PATH: ${AEGIS_DATABASE_PATH:-/data/aegis.db}
      AEGIS_PUBLIC_DEMO_DATABASE: ${AEGIS_PUBLIC_DEMO_DATABASE:-false}
      AEGIS_ALLOW_PUBLIC_REGISTRATION: "false"
      # Local HTTP only. Production deployments default to Secure cookies.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:?Load AUTH_SECRET from .env.local}
      PUBLIC_DEMO_ACCOUNTS_ENABLED: ${PUBLIC_DEMO_ACCOUNTS_ENABLED:-false}
      PUBLIC_DEMO_OPENAI_ENABLED: ${PUBLIC_DEMO_OPENAI_ENABLED:-false}
      PUBLIC_DEMO_DAILY_REQUEST_LIMIT: ${PUBLIC_DEMO_DAILY_REQUEST_LIMIT:-20}
      PUBLIC_DEMO_MAX_PROMPT_CHARS: ${PUBLIC_DEMO_MAX_PROMPT_CHARS:-1200}
      PUBLIC_DEMO_MAX_OUTPUT_TOKENS: ${PUBLIC_DEMO_MAX_OUTPUT_TOKENS:-512}
      PUBLIC_DEMO_MAX_DURATION_MS: ${PUBLIC_DEMO_MAX_DURATION_MS:-25000}
      PUBLIC_DEMO_LOGIN_PER_EMAIL_HOURLY_LIMIT: ${PUBLIC_DEMO_LOGIN_PER_EMAIL_HOURLY_LIMIT:-6}
      PUBLIC_DEMO_LOGIN_PER_IP_HOURLY_LIMIT: ${PUBLIC_DEMO_LOGIN_PER_IP_HOURLY_LIMIT:-20}
      PUBLIC_DEMO_ADMIN_EMAIL: ${PUBLIC_DEMO_ADMIN_EMAIL:-}
      PUBLIC_DEMO_USER1_EMAIL: ${PUBLIC_DEMO_USER1_EMAIL:-}
      PUBLIC_DEMO_USER2_EMAIL: ${PUBLIC_DEMO_USER2_EMAIL:-}
      PUBLIC_DEMO_REVEAL_CREDENTIALS: ${PUBLIC_DEMO_REVEAL_CREDENTIALS:-false}
      PUBLIC_DEMO_ADMIN_PASSWORD: ${PUBLIC_DEMO_ADMIN_PASSWORD:-}
      PUBLIC_DEMO_USER1_PASSWORD: ${PUBLIC_DEMO_USER1_PASSWORD:-}
      PUBLIC_DEMO_USER2_PASSWORD: ${PUBLIC_DEMO_USER2_PASSWORD:-}
      # Optional demo-only inference. Remains disabled unless the operator has
      # verified that this Groq account and project are still on the free tier.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      DEMO_LIVE_INFERENCE_ENABLED: ${DEMO_LIVE_INFERENCE_ENABLED:-false}
      DEMO_GROQ_FREE_TIER_CONFIRMED: ${DEMO_GROQ_FREE_TIER_CONFIRMED:-false}
      DEMO_GLOBAL_DAILY_REQUEST_LIMIT: ${DEMO_GLOBAL_DAILY_REQUEST_LIMIT:-60}
      DEMO_PER_IP_HOURLY_LIMIT: ${DEMO_PER_IP_HOURLY_LIMIT:-5}
      DEMO_MAX_PROMPT_CHARS: ${DEMO_MAX_PROMPT_CHARS:-1200}
      DEMO_MAX_OUTPUT_TOKENS: ${DEMO_MAX_OUTPUT_TOKENS:-256}
      DEMO_MAX_DURATION_MS: ${DEMO_MAX_DURATION_MS:-25000}
      DEMO_TRUSTED_PROXY: ${DEMO_TRUSTED_PROXY:-off}
    volumes:
      - ${AEGIS_DATA_VOLUME:-aegis_data}:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  aegis_data:
    name: ${AEGIS_DATA_VOLUME:-aegis_data}
